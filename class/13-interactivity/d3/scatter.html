// Draw big countries first so small ones aren't hidden underneath
data.sort((a, b) => b.pop - a.pop);

// 2. SCALES: map data values to pixel positions
const width = 900, height = 560;
const margin = {top: 70, right: 30, bottom: 60, left: 70};

const x = d3.scaleLog()
  .domain([200, 60000])
  .range([margin.left, width - margin.right]);

const y = d3.scaleLinear()
  .domain([40, 85])
  .range([height - margin.bottom, margin.top]);

const r = d3.scaleSqrt()
  .domain([0, d3.max(data, d => d.pop)])
  .range([0, 26]);

const color = d3.scaleOrdinal()
  .domain(["Africa", "Americas", "Asia", "Europe", "Oceania"])
  .range(["#E69F00", "#56B4E9", "#009E73", "#CC79A7", "#0072B2"]);

// 3. SVG + AXES
const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`);

svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x)
    .tickValues([500, 1000, 2000, 5000, 10000, 20000, 50000])
    .tickFormat(d3.format("$,")));

svg.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y));

svg.append("text")
  .attr("x", width / 2).attr("y", height - 15)
  .attr("text-anchor", "middle")
  .text("GDP per capita (log scale)");

svg.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -height / 2).attr("y", 20)
  .attr("text-anchor", "middle")
  .text("Life expectancy (years)");

svg.append("text")
  .attr("x", margin.left).attr("y", 32)
  .attr("font-size", 22).attr("font-weight", "bold")
  .text("Richer countries live longer, but income isn't everything");

svg.append("text")
  .attr("x", margin.left).attr("y", 54)
  .attr("fill", "#555")
  .text("2007. Each bubble is a country; bubble area is population.");

// Legend for the color scale
const legend = svg.append("g")
  .attr("transform", `translate(${width - margin.right - 110},${height - margin.bottom - 100})`);
color.domain().forEach((continent, i) => {
  legend.append("circle")
    .attr("cx", 0).attr("cy", i * 18).attr("r", 6).attr("fill", color(continent));
  legend.append("text")
    .attr("x", 12).attr("y", i * 18 + 4).attr("font-size", 13).text(continent);
});

// 4. MARKS: one circle per row of data
const tooltip = d3.select("#chart").append("div").attr("class", "tooltip");

svg.append("g").selectAll("circle")
  .data(data)
  .join("circle")
    .attr("cx", d => x(d.gdpPercap))
    .attr("cy", d => y(d.lifeExp))
    .attr("r", d => r(d.pop))
    .attr("fill", d => color(d.continent))
    .attr("fill-opacity", 0.75)
    .attr("stroke", "white")
    // 5. INTERACTION: show a tooltip on hover
    .on("mousemove", (event, d) => {
      const [mx, my] = d3.pointer(event, document.querySelector("#chart"));
      tooltip
        .style("opacity", 1)
        .style("left", (mx + 12) + "px")
        .style("top", (my + 12) + "px")
        .html(`<b>${d.country}</b><br>
               Life expectancy: ${d.lifeExp.toFixed(1)} years<br>
               GDP per capita: $${d3.format(",.0f")(d.gdpPercap)}<br>
               Population: ${d3.format(".3s")(d.pop)}`);
    })
    .on("mouseleave", () => tooltip.style("opacity", 0));
</script>
