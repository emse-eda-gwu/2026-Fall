svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x)
    .tickValues([500, 1000, 2000, 5000, 10000, 20000, 50000, 100000])
    .tickFormat(d3.format("$,")));
svg.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y));

svg.append("text")
  .attr("x", width / 2).attr("y", height - 15)
  .attr("text-anchor", "middle").text("GDP per capita (log scale)");
svg.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -height / 2).attr("y", 20)
  .attr("text-anchor", "middle").text("Life expectancy (years)");
svg.append("text")
  .attr("x", margin.left).attr("y", 32)
  .attr("font-size", 22).attr("font-weight", "bold")
  .text("Over 55 years, most countries moved up and to the right");
svg.append("text")
  .attr("x", margin.left).attr("y", 54).attr("fill", "#555")
  .text("Each bubble is a country; bubble area is population. Press play or drag the slider.");

const marks = svg.append("g");
const tooltip = d3.select("#chart").append("div").attr("class", "tooltip");

// Draw (or animate to) a given year
function draw(year, duration) {
  yearLabel.text(year);
  // Big countries first so small ones aren't hidden underneath
  const rows = byYear.get(year)
    .filter(d => active.has(d.continent))
    .sort((a, b) => b.pop - a.pop);

  marks.selectAll("circle")
    .data(rows, d => d.country)
    .join(
      enter => enter.append("circle")
        .attr("cx", d => x(d.gdpPercap))
        .attr("cy", d => y(d.lifeExp))
        .attr("r", 0)
        .attr("fill", d => color(d.continent))
        .attr("fill-opacity", 0.75)
        .attr("stroke", "white"),
      update => update,
      exit => exit.transition().duration(duration).attr("r", 0).remove()
    )
    .order()
    .on("mousemove", (event, d) => {
      const [mx, my] = d3.pointer(event, document.querySelector("#chart"));
      tooltip
        .style("opacity", 1)
        .style("left", (mx + 12) + "px")
        .style("top", (my + 12) + "px")
        .html(`<b>${d.country}</b> (${d.year})<br>
               Life expectancy: ${d.lifeExp.toFixed(1)} years<br>
               GDP per capita: $${d3.format(",.0f")(d.gdpPercap)}<br>
               Population: ${d3.format(".3s")(d.pop)}`);
    })
    .on("mouseleave", () => tooltip.style("opacity", 0))
    .transition().duration(duration).ease(d3.easeLinear)
      .attr("cx", d => x(d.gdpPercap))
      .attr("cy", d => y(d.lifeExp))
      .attr("r", d => r(d.pop));
}

// Controls: slider, play button, and clickable continent chips
const slider = document.querySelector("#slider");
const playButton = document.querySelector("#play");
let timer = null;

function stop() {
  clearInterval(timer);
  timer = null;
  playButton.innerHTML = "&#9654; Play";
}

function play() {
  if (+slider.value >= 2007) slider.value = 1952;
  playButton.innerHTML = "&#10073;&#10073; Pause";
  draw(+slider.value, 300);
  timer = setInterval(() => {
    if (+slider.value >= 2007) { stop(); return; }
    slider.value = +slider.value + 5;
    draw(+slider.value, 800);
    if (+slider.value >= 2007) stop();
  }, 800);
}

playButton.addEventListener("click", () => timer ? stop() : play());
slider.addEventListener("input", () => { stop(); draw(+slider.value, 300); });

d3.select("#legend").selectAll("button")
  .data(continents)
  .join("button")
    .attr("class", "chip")
    .style("border-color", d => color(d))
    .text(d => d)
    .on("click", function (event, d) {
      active.has(d) ? active.delete(d) : active.add(d);
      d3.select(this).classed("off", !active.has(d));
      draw(+slider.value, 300);
    });

draw(1952, 0);
</script>
</body>
